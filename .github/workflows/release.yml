name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: node scripts/package.mjs
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: artifacts/autoskip-*
          body_path: docs/release-notes.md
