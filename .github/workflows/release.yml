name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package extension zip
        run: |
          cd dist
          zip -r ../autoskip-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: autoskip-*.zip
          generate_release_notes: true
