<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoSkip</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">⏵⏵</span>AutoSkip
        </div>
        <label class="master toggle">
          <span id="enabled-label">On</span>
          <input
            id="enabled"
            type="checkbox"
            role="switch"
            aria-label="AutoSkip"
          />
          <span class="track" aria-hidden="true"></span>
        </label>
      </header>
      <p id="status" class="notice error" role="status"></p>
      <section id="empty" class="empty" hidden>
        <span class="empty-icon" aria-hidden="true">▶</span>
        <h1>Ready when you are.</h1>
        <p>Open a show on Netflix, Prime Video, Disney+ or Apple TV.</p>
        <p class="small">Just installed or updated? Reload the show's tab.</p>
      </section>
      <section id="player-settings" hidden>
        <div class="watching">
          <p class="eyebrow">
            <span class="dot" aria-hidden="true"></span
            ><span id="service-name">Netflix</span>
          </p>
          <h1 id="series-name">Your next good watch.</h1>
          <p class="subtitle">Less clicking. More watching.</p>
        </div>
        <div id="disabled-notice" class="notice" hidden>
          <span id="disabled-message"></span>
          <button id="service-enabled" class="text-button" type="button" hidden>
            Turn on
          </button>
        </div>
        <div class="scope-row">
          <label for="scope">Apply to</label>
          <select id="scope" aria-label="Apply these choices to"></select>
        </div>
        <fieldset id="choices">
          <legend class="sr-only">Automatic actions</legend>
          <label class="choice toggle">
            <span class="choice-copy"
              ><span id="intro-label" class="choice-title">Skip intros</span
              ><span id="intro-help" class="description"
                >Go straight to the story.</span
              ></span
            >
            <input
              type="checkbox"
              role="switch"
              data-action="intro"
              aria-labelledby="intro-label"
              aria-describedby="intro-help"
            />
            <span class="track" aria-hidden="true"></span>
          </label>
          <label class="choice toggle">
            <span class="choice-copy"
              ><span id="recap-label" class="choice-title">Skip recaps</span
              ><span id="recap-help" class="description"
                >Skip the “previously on…” part.</span
              ></span
            >
            <input
              type="checkbox"
              role="switch"
              data-action="recap"
              aria-labelledby="recap-label"
              aria-describedby="recap-help"
            />
            <span class="track" aria-hidden="true"></span>
          </label>
          <label class="choice toggle">
            <span class="choice-copy"
              ><span id="credits-label" class="choice-title"
                >Play next episode</span
              ><span id="credits-help" class="description"
                >Move on when this episode is ending.</span
              ></span
            >
            <input
              type="checkbox"
              role="switch"
              data-action="credits"
              aria-labelledby="credits-label"
              aria-describedby="credits-help"
            />
            <span class="track" aria-hidden="true"></span>
          </label>
          <label class="choice toggle">
            <span class="choice-copy"
              ><span id="stillWatching-label" class="choice-title"
                >Keep watching</span
              ><span id="stillWatching-help" class="description"
                >Answer “Are you still watching?” for you.</span
              ></span
            >
            <input
              type="checkbox"
              role="switch"
              data-action="stillWatching"
              aria-labelledby="stillWatching-label"
              aria-describedby="stillWatching-help"
            />
            <span class="track" aria-hidden="true"></span>
          </label>
        </fieldset>
        <button
          id="reset-series"
          class="text-button reset"
          type="button"
          hidden
        >
          Use my Netflix settings
        </button>
        <p id="scope-hint" class="small scope-hint"></p>
        <div id="pause-notice" class="notice" hidden>
          <span id="pause-hint"></span>
          <button id="resume-session" class="text-button" type="button">
            Resume
          </button>
        </div>
      </section>
      <footer class="footer">
        <span>Saved on this device</span>
        <a
          id="options-link"
          href="./options.html"
          target="_blank"
          rel="noreferrer"
          >Settings <span aria-hidden="true">↗</span></a
        >
      </footer>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
